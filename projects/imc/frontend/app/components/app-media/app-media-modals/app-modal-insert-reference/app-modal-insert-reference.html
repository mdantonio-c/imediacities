<!-- Modal for inserting new notes -->
<app-media-modal [data]="data" [media_type]="media_type">
  <div class="col-12 col-sm-7" modal-col>
    <form [formGroup]="referenceForm" class="w-100">
      <div class="form-floating mb-2">
        <input
          id="authors"
          type="text"
          class="form-control imc--input"
          formControlName="authors"
          placeholder="Surname Name"
          required
        />
        <label for="authors" class="px-0">Author(s)*</label>
        <div
          class="invalid-feedback d-block mt-0"
          *ngIf="referenceForm.get('authors').touched && referenceForm.get('authors').invalid"
        >
          At least one author is required
        </div>
      </div>
      <div class="form-floating mb-2">
        <input
          id="bookTitle"
          type="text"
          class="form-control imc--input"
          formControlName="book_title"
          placeholder="Book Title"
        />
        <label for="bookTitle" class="px-0">Book title</label>
      </div>
      <div class="form-floating mb-2">
        <input
          id="_title"
          type="text"
          class="form-control imc--input"
          formControlName="title"
          placeholder="Title"
          required
        />
        <label for="_title" class="px-0">Title*</label>
        <div
          class="invalid-feedback d-block mt-0"
          *ngIf="referenceForm.get('title').touched && referenceForm.get('title').invalid"
        >
          Title is required
        </div>
      </div>
      <div class="row g-0">
        <div class="form-floating mb-2 col-5">
          <input
            id="Journal"
            type="text"
            class="form-control imc--input"
            formControlName="journal"
            placeholder="Journal"
          />
          <label for="journal" class="px-0">Journal</label>
        </div>
        <div class="form-floating mb-2 offset-2 col-5">
          <input
            id="volume"
            type="text"
            class="form-control imc--input"
            formControlName="volume"
            placeholder="Volume"
          />
          <label for="volume" class="px-0">Volume</label>
        </div>
      </div>
      <div class="row g-0">
        <div class="form-floating mb-2 col-5">
          <input
            id="number"
            type="text"
            class="form-control imc--input"
            formControlName="number"
            placeholder="Number"
          />
          <label for="number" class="px-0">Number</label>
        </div>
        <div class="form-floating mb-2 offset-2 col-5">
          <input
            id="year"
            type="number"
            class="form-control imc--input"
            formControlName="year"
            placeholder="Year"
          />
          <label for="year" class="px-0">Year</label>
        </div>
      </div>
      <div class="row g-0">
        <div class="form-floating mb-2 col-5">
          <select
            id="month"
            class="form-select imc--input"
            id="month"
            formControlName="month"
            placeholder="month"
          >
            <option value=""></option>
            <option *ngFor="let m of months" [value]="m.value">
              {{m.key}}
            </option>
          </select>
          <label for="month" class="px-0">Month</label>
        </div>
        <div class="form-floating mb-2 offset-2 col-5">
          <input
            id="editor"
            type="text"
            class="form-control imc--input"
            formControlName="editor"
            placeholder="Editor"
          />
          <label for="editor" class="px-0">Editor</label>
        </div>
      </div>
      <div class="row g-0">
        <div class="form-floating mb-2 col-5">
          <input
            id="publisher"
            type="text"
            class="form-control imc--input"
            formControlName="publisher"
            placeholder="Publisher"
          />
          <label for="publisher" class="px-0">Publisher</label>
        </div>
        <div class="form-floating mb-2 offset-2 col-5">
          <input
            id="address"
            type="text"
            class="form-control imc--input"
            formControlName="address"
            placeholder="Address"
          />
          <label for="address" class="px-0">Address</label>
        </div>
      </div>
      <div class="form-floating mb-2">
        <input
          id="url"
          type="text"
          class="form-control imc--input"
          formControlName="url"
          placeholder="url"
        />
        <label for="url" class="px-0">URL</label>
        <div
          class="invalid-feedback d-block"
          *ngIf="referenceForm.get('url').dirty && referenceForm.get('url').invalid"
        >
          Please provide a valid URL
        </div>
      </div>
      <div class="row g-0">
        <div class="form-floating mb-2 col-5">
          <input
            id="isbn"
            type="text"
            class="form-control imc--input"
            formControlName="isbn"
            placeholder="ISBN"
          />
          <label for="isbn" class="px-0">ISBN</label>
          <div
            class="invalid-feedback d-block"
            *ngIf="referenceForm.get('isbn').dirty && referenceForm.get('isbn').invalid"
          >
            Please provide a valid ISBN
          </div>
        </div>
        <div class="form-floating mb-2 offset-2 col-5">
          <input
            id="doi"
            type="text"
            class="form-control imc--input imc--flex--item-end"
            formControlName="doi"
            placeholder="DOI"
          />
          <label for="doi" class="px-0">DOI</label>
          <div
            class="invalid-feedback d-block"
            *ngIf="referenceForm.get('doi').dirty && referenceForm.get('doi').invalid"
          >
            Please provide a valid DOI
          </div>
        </div>
      </div>
    </form>
  </div>
  <button
    type="button"
    class="btn btn-accent"
    modal-button
    [disabled]="referenceForm.invalid"
    (click)="save()"
  >
    Save
  </button>
  <!-- outcome -->
  <app-info
    modal-button
    [message]="save_result.message"
    [result]="save_result.status"
    *ngIf="save_result.visible"
    (click)="save_result.visible = false"
  ></app-info>
</app-media-modal>
